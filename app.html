  .cta { display: inline-grid; place-items: center; width: 100%; padding: 18px 24px; border-radius: 12px; border: 0; background: var(--white); color: var(--green); font: 700 18px/1 'Roboto', Arial, sans-serif; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
  .cta:active { transform: translateY(1px); }
  .cta[disabled] { opacity: 0.6; cursor: default; }
  .cta[hidden] { display: none; }
  .small { font-size: 13px; color: var(--muted); }
  .desk { display: none; gap: 14px; justify-items: center; }
  .qr { background: #fff; padding: 10px; border-radius: 10px; }
  .qr img, .qr canvas { display: block; }
  #ql { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  footer { font-size: 12px; color: var(--muted); }

<!-- iOS Quick Look launcher (needs an <img> child to be treated as an AR link) -->
<a id="ql" rel="ar" href="#"><img alt="" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw=="></a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function () {
  var PDF   = "https://team.autobahnconsultants.com/free-book-ryb";
  var TITLE = "Rock Your Business";
  var SUB   = "Everything we learned from a few hundred CEOs.";
  var BASE  = location.href.replace(/app\.html.*$/, '');
  var GLB   = BASE + 'book.glb';
  var USDZ  = BASE + 'book.usdz';

  var go = document.getElementById('go'), note = document.getElementById('note'), ql = document.getElementById('ql');
  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);

  function ready() { go.disabled = false; go.textContent = 'View in your space'; }

  if (isIOS) {
    // Quick Look shows an "Open it" banner; tapping it tells this page, and we open the book page.
    ql.addEventListener('message', function (e) { if (e.data === '_apple_ar_quicklook_button_tapped') location.href = PDF; }, false);
    ql.href = USDZ + '#callToAction=' + encodeURIComponent('Open it')
            + '&checkoutTitle=' + encodeURIComponent(TITLE)
            + '&checkoutSubtitle=' + encodeURIComponent(SUB)
            + '&allowsContentScaling=0';
    ready();
    go.addEventListener('click', function () { ql.click(); });
  } else if (isAndroid) {
    // Scene Viewer shows the title as a tappable link at the bottom of the AR view; that link opens the book page.
    ready();
    go.addEventListener('click', function () {
      var sv = 'arvr.google.com/scene-viewer/1.0?file=' + encodeURIComponent(GLB)
             + '&mode=ar_only&resizable=false&title=' + encodeURIComponent(TITLE + ' · Open it')
             + '&link=' + encodeURIComponent(PDF);
      location.href = 'intent://' + sv + '#Intent;scheme=https;package=com.google.ar.core;action=android.intent.action.VIEW;S.browser_fallback_url=' + encodeURIComponent(location.href) + ';end;';
    });
  } else {
    go.hidden = true; document.getElementById('desk').style.display = 'grid';
  }
})();
</script>
<script>
  try { new QRCode(document.getElementById('qr'), { text: location.origin + location.pathname.replace(/app\.html$/, ''), width: 160, height: 160, correctLevel: QRCode.CorrectLevel.M }); }
  catch (e) { document.getElementById('qr').textContent = location.href; }
</script>
